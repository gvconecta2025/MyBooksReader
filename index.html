<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biblioteca Digital</title>
    <style>
        /* =========================================
           1. ESTILOS GERAIS E CABEÇALHO
           ========================================= */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background-color: #2c3e50; }
        
        .cabecalho-minimo { height: 45px; background-color: #ffffff; border-bottom: 1px solid #dadce0; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 100; flex-shrink: 0; }
        .grupo-esquerda { display: flex; align-items: center; gap: 10px; }
        .titulo-header { font-family: 'Georgia', serif; font-size: 15px; font-weight: bold; font-style: italic; color: #1e3a8a; }
        
        .btn-acao-header { background-color: #e8f0fe; color: #1a73e8; border: 1px solid #1a73e8; border-radius: 4px; padding: 4px 12px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-acao-header:hover { background-color: #1a73e8; color: #ffffff; }

        .conteudo-principal { display: flex; flex: 1; overflow: hidden; position: relative; width: 100%; }

        /* =========================================
           2. TELA 1: A BIBLIOTECA
           ========================================= */
        #tela-biblioteca { width: 100%; height: 100%; overflow-y: auto; background-color: #f0f2f5; padding: 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .grid-livros { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1000px; width: 100%; margin-top: 20px; }
        
        .cartao-livro { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; width: 220px; height: 140px; padding: 20px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; box-sizing: border-box; }
        .cartao-livro:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(26,115,232,0.15); border-color: #1a73e8; }
        .cartao-livro h3 { margin: 0; font-family: 'Georgia', serif; font-size: 16px; color: #1e3a8a; }
        .cartao-livro .badge-leitura { margin-top: 15px; font-size: 11px; background: #e8f0fe; color: #1a73e8; padding: 5px 12px; border-radius: 12px; font-weight: bold; }

        .status-scanner { color: #5f6368; font-size: 14px; text-align: center; margin-bottom: 20px; font-style: italic; }

        /* =========================================
           3. TELA 2: O LEITOR (EXATO DESKTOP APP)
           ========================================= */
        #tela-leitor { width: 100%; height: 100%; display: none; flex-direction: row; }
        
        .coluna-menu { width: 260px; background-color: #f8f9fa; border-right: 2px solid #dadce0; padding: 15px; display: flex; flex-direction: column; z-index: 50; flex-shrink: 0; }
        .lista-pilulas { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; padding-right: 5px; }
        .botao-menu { background-color: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 500; color: #3c4043; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; }
        .botao-menu:hover { background-color: #f1f3f4; border-color: #1a73e8; }
        .botao-menu.ativo { background-color: #1a73e8; color: #ffffff; border-color: #1a73e8; box-shadow: 0 4px 10px rgba(26,115,232,0.3); }
        .texto-botao { pointer-events: none; }
        .contador-palavras { display: none; } 

        .coluna-livro { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background-color: #2c3e50; }
        
        .botao-navegacao { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; background-color: #ffffff; border: 1px solid #dadce0; box-shadow: 0 4px 15px rgba(0,0,0,0.3); color: #1a73e8; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; font-size: 24px; font-weight: bold; transition: 0.2s; }
        .botao-navegacao:active { background-color: #e8f0fe; transform: translateY(-50%) scale(0.95); }
        .btn-esquerda { left: 20px; } .btn-direita { right: 20px; }

        /* A ARQUITETURA ORIGINAL DO SEU APLICATIVO */
        .secao-livro { display: none; flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: center; padding: 0 40px; height: 100%; box-sizing: border-box; scroll-behavior: smooth; }
        .secao-livro.ativo { display: flex; }
        
        .container-leitura { position: relative; width: max-content; transform-origin: left center; transition: transform 0.3s ease; display: flex; align-items: center; }
        .camada-fundo { display: flex; gap: 40px; }
        
        /* A página tridimensional clássica */
        .pagina-visual { width: 14cm; height: 21cm; background-color: #fffaf0; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; flex-shrink: 0; }
        .pagina-branca { display: flex; align-items: center; justify-content: center; color: #bdc3c7; font-size: 11pt; font-style: italic; }
        
        /* A diagramação exata em colunas */
        .camada-texto { position: absolute; top: 2cm; left: 2cm; height: 17cm; width: calc(100% - 4cm); column-width: 10cm; column-gap: calc(4cm + 40px); column-fill: auto; font-family: Georgia, serif; font-size: 12pt; line-height: 1.5; text-align: justify; color: #000000; }
        .camada-texto * { color: #000000; } 
        
        .numero-pagina { position: absolute; bottom: 1cm; left: 0; right: 0; text-align: center; font-size: 10pt; color: #7f8c8d; }

        /* Responsividade para Telas Pequenas */
        .btn-mobile-menu { display: none; background: none; border: none; font-size: 22px; color: #1e3a8a; cursor: pointer; padding: 0; margin-right: 15px; }
        .overlay { display: none; position: fixed; top: 45px; left: 0; width: 100vw; height: calc(100vh - 45px); background: rgba(0,0,0,0.5); z-index: 40; }
        
        @media (max-width: 900px) {
            .btn-mobile-menu { display: block; }
            .coluna-menu { position: absolute; left: -100%; height: 100%; box-shadow: 5px 0 20px rgba(0,0,0,0.3); transition: left 0.3s ease; }
            .coluna-menu.aberto { left: 0; }
            .overlay.ativo { display: block; }
            .secao-livro { padding: 0 10px; } /* Menos margem no celular */
            .btn-esquerda { left: 5px; } .btn-direita { right: 5px; }
            .botao-navegacao { width: 40px; height: 40px; font-size: 20px; }
            .container-leitura { transform-origin: left top; } /* Ancoragem no topo para mobile */
            .secao-livro { align-items: flex-start; padding-top: 20px; }
        }
    </style>
</head>
<body>

    <header class="cabecalho-minimo">
        <div class="grupo-esquerda">
            <button class="btn-mobile-menu" id="btn-toggle-menu" onclick="toggleMenuMobile()" style="display:none;">☰</button>
            <span class="titulo-header" id="nome-header">Acervo Digital</span>
        </div>
        <div>
            <button class="btn-acao-header" onclick="voltarParaBiblioteca()" id="btn-voltar-biblio" style="display:none;">← Voltar ao Catálogo</button>
        </div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenuMobile()"></div>

    <div class="conteudo-principal">
        
        <div id="tela-biblioteca">
            <div class="status-scanner" id="status-scanner">Sincronizando biblioteca com a nuvem...</div>
            <div class="grid-livros" id="grid-livros"></div>
        </div>

        <div id="tela-leitor">
            <aside class="coluna-menu" id="coluna-menu">
                <div style="font-weight: bold; color: #1e3a8a; margin-bottom: 15px; border-bottom: 1px solid #dadce0; padding-bottom: 10px; font-size: 14px;">Capítulos da Obra</div>
                <div class="lista-pilulas" id="lista-pilulas"></div>
            </aside>

            <main class="coluna-livro" id="container-leitor-master">
                <button class="botao-navegacao btn-esquerda" onclick="saltarEsquerda()">❮</button>
                <button class="botao-navegacao btn-direita" onclick="saltarDireita()">❯</button>
                
                <div id="area-paginas" style="width: 100%; height: 100%;"></div>
            </main>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'gvconecta2025';
        const GITHUB_REPO = 'MyBooksReader';

        const telaBiblioteca = document.getElementById('tela-biblioteca');
        const telaLeitor = document.getElementById('tela-leitor');
        const nomeHeader = document.getElementById('nome-header');
        const btnVoltarBiblio = document.getElementById('btn-voltar-biblio');
        const btnToggleMenu = document.getElementById('btn-toggle-menu');

        let escalaAtualDaPagina = 1; // Variável global para saber o zoom da página

        async function escanearRaizDoGithub() {
            const status = document.getElementById('status-scanner');
            const grid = document.getElementById('grid-livros');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?nocache=` + new Date().getTime());
                if (!response.ok) throw new Error("Acesso recusado pela API.");
                const arquivos = await response.json();
                
                const livrosJson = arquivos.filter(arq => 
                    arq.name.endsWith('.json') && arq.name !== 'package.json' && arq.name !== 'package-lock.json'
                );

                if(livrosJson.length === 0) {
                    status.innerHTML = "Nenhuma obra disponível no catálogo remoto.";
                    return;
                }
                status.style.display = 'none';
                grid.innerHTML = ''; 

                livrosJson.forEach(livro => {
                    const cartao = document.createElement('div');
                    cartao.className = 'cartao-livro';
                    const nomeExibicao = livro.name.replace('.json', '').replace(/_/g, ' ').replace(/-/g, ' ');
                    cartao.innerHTML = `<h3>${nomeExibicao}</h3><span class="badge-leitura">Abrir Obra</span>`;
                    cartao.onclick = () => carregarDadosDaNuvem(livro.download_url);
                    grid.appendChild(cartao);
                });
            } catch (erro) {
                status.innerText = "Erro ao sincronizar o catálogo de livros.";
            }
        }

        async function carregarDadosDaNuvem(url) {
            nomeHeader.innerText = "A descarregar obra...";
            try {
                const urlAntiCache = url + "?t=" + new Date().getTime();
                const response = await fetch(urlAntiCache);
                if (!response.ok) throw new Error(`Erro de rede`);
                
                const textoPuro = await response.text();
                const textoLimpo = textoPuro.trim().replace(/^\uFEFF/, '');
                
                try {
                    const dados = JSON.parse(textoLimpo);
                    renderizarInterfaceDoLivro(dados);
                } catch (erroJson) {
                    throw new Error(`Falha estrutural ou ficheiro corrompido.`);
                }
            } catch (e) {
                alert(`Erro:\n\n${e.message}`);
                nomeHeader.innerText = "Acervo Digital";
            }
        }

        function renderizarInterfaceDoLivro(dados) {
            telaBiblioteca.style.display = 'none';
            telaLeitor.style.display = 'flex';
            btnVoltarBiblio.style.display = 'block';
            
            nomeHeader.innerText = dados.titulo || "Leitura";
            if (window.innerWidth <= 900) btnToggleMenu.style.display = 'block';

            const listaPilulas = document.getElementById('lista-pilulas');
            listaPilulas.innerHTML = dados.pilulasHTML;
            const areaPaginas = document.getElementById('area-paginas');
            areaPaginas.innerHTML = dados.conteudoLivroHTML;

            // Bloqueio Total
            areaPaginas.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
            listaPilulas.querySelectorAll('.botao-menu').forEach(btn => {
                btn.removeAttribute('draggable');
                const idAlvo = btn.getAttribute('data-secao');
                btn.setAttribute('onclick', `abrirSecao('${idAlvo}', this)`);
            });

            // Chama a função da magia matemática
            ajustarEscalaDasPaginas();
            window.addEventListener('resize', ajustarEscalaDasPaginas);

            const idMarcador = dados.marcador || areaPaginas.querySelector('.secao-livro')?.id;
            if(idMarcador) {
                const btnAlvo = document.querySelector(`[data-secao="${idMarcador}"]`);
                if(btnAlvo) abrirSecao(idMarcador, btnAlvo);
            }
        }

        function abrirSecao(idDaSecao, elementoClicado) {
            document.querySelectorAll('.secao-livro').forEach(s => { s.classList.remove('ativo'); s.scrollLeft = 0; });
            const secaoAlvo = document.getElementById(idDaSecao);
            if(secaoAlvo) secaoAlvo.classList.add('ativo');
            
            document.querySelectorAll('.botao-menu').forEach(b => b.classList.remove('ativo'));
            if(elementoClicado) elementoClicado.classList.add('ativo');
            
            if(window.innerWidth <= 900 && document.getElementById('coluna-menu').classList.contains('aberto')) toggleMenuMobile();
        }

        // Navegação adaptada à escala
        function saltarEsquerda() { 
            const s = document.querySelector('.secao-livro.ativo'); 
            if (s) {
                const pagina = s.querySelector('.pagina-visual');
                if (pagina) {
                    // O movimento tem de considerar o espaçamento e a escala para ficar perfeito
                    const salto = (pagina.offsetWidth + 40) * escalaAtualDaPagina;
                    s.scrollBy({ left: -salto, behavior: 'smooth' }); 
                }
            }
        }
        
        function saltarDireita() { 
            const s = document.querySelector('.secao-livro.ativo'); 
            if (s) {
                const pagina = s.querySelector('.pagina-visual');
                if (pagina) {
                    const salto = (pagina.offsetWidth + 40) * escalaAtualDaPagina;
                    s.scrollBy({ left: salto, behavior: 'smooth' }); 
                }
            }
        }

        // Rolar as páginas com a roda do rato
        document.getElementById('area-paginas').addEventListener('wheel', function(event) {
            if (event.deltaY !== 0) { 
                const s = document.querySelector('.secao-livro.ativo'); 
                if (s) { s.scrollLeft += event.deltaY; event.preventDefault(); } 
            }
        }, { passive: false });

        // A Matemática da Proporção
        function ajustarEscalaDasPaginas() {
            const areaPaginas = document.getElementById('container-leitor-master');
            if(!areaPaginas) return;

            // 14cm no PC equivale a aproximadamente 530px
            const larguraOriginalPagina = 530; 
            const alturaOriginalPagina = 794; // 21cm

            // Medidas disponíveis no ecrã atual
            const larguraDisponivel = areaPaginas.clientWidth - 40; 
            const alturaDisponivel = areaPaginas.clientHeight - 40;

            let escala = 1;

            if (window.innerWidth <= 900) {
                // Modo telemóvel: a página reduz para caber inteira na altura e na largura do ecrã
                const escalaLargura = (larguraDisponivel + 20) / larguraOriginalPagina;
                const escalaAltura = alturaDisponivel / alturaOriginalPagina;
                escala = Math.min(escalaLargura, escalaAltura);
            } else {
                // Modo PC: reduz apenas se o ecrã for muito pequeno na vertical
                if (alturaDisponivel < alturaOriginalPagina) {
                    escala = alturaDisponivel / alturaOriginalPagina;
                }
            }

            escalaAtualDaPagina = escala;

            document.querySelectorAll('.container-leitura').forEach(c => {
                c.style.transform = `scale(${escala})`;
            });
        }

        function toggleMenuMobile() { 
            document.getElementById('coluna-menu').classList.toggle('aberto'); 
            document.getElementById('overlay').classList.toggle('ativo');
        }

        function voltarParaBiblioteca() {
            telaLeitor.style.display = 'none';
            telaBiblioteca.style.display = 'flex';
            btnVoltarBiblio.style.display = 'none';
            btnToggleMenu.style.display = 'none';
            nomeHeader.innerText = "Acervo Digital";
            document.getElementById('coluna-menu').classList.remove('aberto');
            document.getElementById('overlay').classList.remove('ativo');
            escanearRaizDoGithub(); 
        }

        window.onload = escanearRaizDoGithub;
    </script>
</body>
</html>
