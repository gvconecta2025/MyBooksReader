<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Obras</title>
    <style>
        body { margin: 0; padding: 0; font-family: Georgia, serif; background-color: #2c3e50; height: 100vh; display: flex; flex-direction: column; }
        .cabecalho { height: 60px; background: #fff; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .titulo-header { font-style: italic; color: #1e3a8a; font-weight: bold; margin: 0 auto; }
        .area-leitura { flex: 1; display: flex; align-items: center; justify-content: center; }
        #leitor-conteudo { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .secao-livro { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
        .secao-livro.ativo { display: flex; }
        .btn-nav { position: fixed; top: 50%; background: #fff; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 100; }
        .btn-ant { left: 20px; } .btn-prox { right: 20px; }
    </style>
</head>
<body>
    <header class="cabecalho"><div id="titulo-obra" class="titulo-header">Carregando livro...</div></header>
    <main class="area-leitura"><div id="leitor-conteudo"></div></main>
    <button class="btn-nav btn-ant" onclick="mudarPagina(-1)">❮</button>
    <button class="btn-nav btn-prox" onclick="mudarPagina(1)">❯</button>

    <script>
        let secoes = [];
        let indiceAtual = 0;

        async function carregar() {
            try {
                const response = await fetch('livro.json');
                const dados = await response.json();
                document.getElementById('titulo-obra').innerText = dados.titulo;
                const container = document.getElementById('leitor-conteudo');
                container.innerHTML = dados.conteudoLivroHTML;
                secoes = Array.from(container.querySelectorAll('.secao-livro'));
                if(secoes.length > 0) secoes[0].classList.add('ativo');
            } catch (e) { document.getElementById('titulo-obra').innerText = "Erro ao carregar o livro. Verifique o arquivo json."; }
        }

        function mudarPagina(direcao) {
            secoes[indiceAtual].classList.remove('ativo');
            indiceAtual = Math.max(0, Math.min(secoes.length - 1, indiceAtual + direcao));
            secoes[indiceAtual].classList.add('ativo');
        }
        carregar();
    </script>
</body>
</html>
